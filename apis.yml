aid: due
name: Due
description: >-
  Due (Due Network, opendue.com) is a London-founded payments infrastructure company (backed by Speedinvest)
  that provides a single API for borderless money movement. Its platform bridges traditional banking rails with
  blockchain networks: cross-border transfers and fiat<->stablecoin on/off-ramps (USDC, EURC, USDT) across 80+
  countries plus SWIFT in 150+, programmable virtual accounts for fund collection, a public FX rate engine,
  automated KYC/KYB onboarding, non-custodial MPC wallets (Vault), and signed webhooks. The REST API is documented
  on due.readme.io and served from api.due.network.
