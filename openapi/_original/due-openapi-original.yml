openapi: 3.0.3
info:
  title: Due API
  version: v1
  description: 'Due provides borderless payment infrastructure: cross-border transfers, fiat<->stablecoin
    on/off-ramps, virtual accounts, FX rates, KYC/KYB onboarding, non-custodial MPC wallets (Vault), and
    webhooks. Assembled by API Evangelist from Due''s per-operation OpenAPI fragments published on due.readme.io.'
  contact:
    email: demo@due.network
    url: https://www.opendue.com
servers:
- url: https://api.due.network
  description: Production
- url: https://api.sandbox.due.network
  description: Sandbox
security:
- BearerAuth: []
tags:
- name: Account
- name: Account Wallets
- name: Blockchain Transfers
- name: Channels
- name: Financial Institutions
- name: KYC
- name: Markets
- name: Quote
- name: Recipients
- name: Simulate pay-in
- name: TOS
- name: Transfers
- name: Usage
- name: Virtual Accounts
- name: Wallets
- name: Webhooks
paths:
  /quote:
    post:
      operationId: CreateQuote
      summary: Create FX quote
      description: Creates a new FX quote for the specified input and output currencies and amounts.
      tags:
      - Quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/fx_dto.QuoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fx_models.Quote'
  /v1/recipients/{id}:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    delete:
      summary: Delete recipient
      description: Soft deletes a recipient by id.
      tags:
      - Recipients
      parameters:
      - in: path
        name: id
        description: Unique identifier for the resource.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
      operationId: delete_v1-recipients-id
    get:
      summary: Get recipient
      description: Retrieves details of a specific recipient.
      tags:
      - Recipients
      parameters:
      - in: path
        name: id
        description: Unique identifier for the resource.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models_v2.Recipient'
      operationId: get_v1-recipients-id
  /v1/webhook_endpoints/{id}:
    delete:
      tags:
      - Webhooks
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bp_models.WebhookEndpoint'
      operationId: delete_v1-webhook-endpoints-id
  /v1/webhook_endpoints/{webhookId}:
    delete:
      parameters:
      - in: path
        name: webhookId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bp_models.WebhookEndpoint'
      operationId: delete_v1-webhook-endpoints-webhookid
    post:
      parameters:
      - in: path
        name: webhookId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bp_dto.UpdateWebhookEndpointRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bp_models.WebhookEndpoint'
      operationId: post_v1-webhook-endpoints-webhookid
  /v1/account_categories/:
    get:
      summary: Get account categories
      description: Retrieves a list of available account categories
      tags:
      - Account
      parameters:
      - in: query
        name: next
        schema:
          type: string
      - in: query
        name: accountType
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repository.CursorPage--transfers_models.AccountCategory'
      operationId: get_v1-account-categories
  /v1/accounts/{accountId}:
    get:
      summary: Get account
      description: Retrieves full account details, including status history, KYC status, and ToS acceptance.
      tags:
      - Account
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bp_models.AccountV1'
      operationId: get_v1-accounts-accountid
  /v1/accounts/:
    get:
      summary: List accounts
      description: Lists all accounts linked to your platform or user.
      tags:
      - Account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/bp_models.AccountV1'
      operationId: get_v1-accounts
  /v1/channels:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: List all channels
      description: Retrieve a list of all transfer channels.
      tags:
      - Channels
      parameters:
      - in: query
        name: onlyAvailable
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/transfers_models_v2.Channel'
      operationId: get_v1-channels
  /v1/financial_institutions/{country2}/{schema}:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: List financial institutions
      description: List all financial institutions by schema and country.
      tags:
      - Financial Institutions
      parameters:
      - in: path
        name: country2
        description: Two-letter country code (ISO 3166-1 alpha-2).
        required: true
        schema:
          type: string
      - in: path
        name: schema
        description: Payment method schema (e.g., bank_us, momo_africa).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/transfers_models.FinancialInstitution'
      operationId: get_v1-financial-institutions-country2-schema
  /v1/financial_institutions/{id}:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: Get financial institution
      description: Get financial institution details by id.
      tags:
      - Financial Institutions
      parameters:
      - in: path
        name: id
        description: Unique identifier for the resource.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models.FinancialInstitution'
      operationId: get_v1-financial-institutions-id
  /v1/kyc/endorsements/{code}:
    get:
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kyc_entities.Endorsement'
      operationId: get_v1-kyc-endorsements-code
    post:
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kyc_entities.Endorsement'
      operationId: post_v1-kyc-endorsements-code
  /v1/kyc/endorsements:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/kyc_entities.Endorsement'
      operationId: get_v1-kyc-endorsements
  /v1/kyc/submissions/{submissionId}:
    get:
      parameters:
      - in: path
        name: submissionId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kyc_entities.Submission'
      summary: Get submission
      operationId: get_v1-kyc-submissions-submissionid
  /v1/kyc/submissions:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: List open submissions
      tags:
      - KYC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/kyc_entities.Submission'
      operationId: get_v1-kyc-submissions
  /v1/kyc:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: Get standard KYC/KYB link
      description: Retrieve standard KYC/KYB details and link.
      tags:
      - KYC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models.SumsubKYC'
      operationId: get_v1-kyc
    post:
      summary: Initiate standard KYC/KYB
      description: Initiate standard KYC/KYB for an account.
      tags:
      - KYC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kyc_entities.Submission'
      operationId: post_v1-kyc
  /v1/recipients:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: List all recipients
      description: List a paginated list of recipients
      tags:
      - Recipients
      parameters:
      - in: query
        name: withDeleted
        description: Include recipients that have been marked as deleted.
        schema:
          type: boolean
      - in: query
        name: next
        description: Cursor for pagination to fetch the next set of results.
        schema:
          type: string
      - in: query
        name: order
        description: Order in which results should be returned (e.g., `asc`, `desc`).
        schema:
          type: string
      - in: query
        name: limit
        description: Number of results to return per page.
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repository.CursorPage--transfers_models_v2.Recipient'
      operationId: get_v1-recipients
    post:
      summary: Create recipient
      description: Creates a new recipient with the provided details.
      tags:
      - Recipients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transfers_dto_v2.RecipientCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models_v2.Recipient'
      operationId: post_v1-recipients
  /v1/token_transfers/{address}/{id}:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: Get token transfer
      tags:
      - Blockchain Transfers
      parameters:
      - in: path
        name: address
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models_v2.TokenTransfer'
      operationId: get_v1-token-transfers-address-id
  /v1/token_transfers/{address}:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: List token transfers
      tags:
      - Blockchain Transfers
      parameters:
      - in: path
        name: address
        required: true
        schema:
          type: string
      - in: query
        name: next
        description: Cursor for pagination to fetch the next set of results.
        schema:
          type: string
      - in: query
        name: order
        description: Order in which results should be returned (e.g., `asc`, `desc`).
        schema:
          type: string
      - in: query
        name: limit
        description: Number of results to return per page.
        schema:
          type: integer
          format: int32
      - in: query
        name: startDate
        description: Start date for filtering results (ISO 8601 format).
        schema:
          type: string
          format: date-time
      - in: query
        name: endDate
        description: Start date for filtering results (ISO 8601 format).
        schema:
          type: string
          format: date-time
      - in: query
        name: includeEmpty
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repository.CursorPage--transfers_models_v2.TokenTransfer'
      operationId: get_v1-token-transfers-address
  /v1/tos/{token}:
    get:
      summary: Get TOS data
      tags:
      - TOS
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models_v2.TosAcceptance'
      operationId: get_v1-tos-token
    post:
      summary: Manually accept TOS
      tags:
      - TOS
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transfers_dto_v2.AcceptTosRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models_v2.TosAcceptance'
      operationId: post_v1-tos-token
  /v1/transfer_intents/{id}:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: Get transfer intent
      description: Get a specific transfer intent by id.
      tags:
      - Blockchain Transfers
      parameters:
      - in: path
        name: id
        description: Unique identifier for the resource.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models_v2.TransferIntent'
      operationId: get_v1-transfer-intents-id
  /v1/transfers/{id}:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: Get transfer details
      description: Get details of a specific transfer by id.
      tags:
      - Transfers
      parameters:
      - in: path
        name: id
        description: Unique identifier for the resource.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models_v2.Transfer'
      operationId: get_v1-transfers-id
  /v1/transfers:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: List all transfers
      description: Retrieves a paginated list of transfers.
      tags:
      - Transfers
      parameters:
      - in: query
        name: next
        description: Cursor for pagination to fetch the next set of results.
        schema:
          type: string
      - in: query
        name: order
        description: Order in which results should be returned (e.g., `asc`, `desc`).
        schema:
          type: string
      - in: query
        name: limit
        description: Number of results to return per page.
        schema:
          type: integer
          format: int32
      - in: query
        name: startDate
        description: Start date for filtering results (ISO 8601 format).
        schema:
          type: string
          format: date-time
      - in: query
        name: endDate
        description: End date for filtering results (ISO 8601 format).
        schema:
          type: string
          format: date-time
      - in: query
        name: includeEmpty
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repository.CursorPage--transfers_models_v2.Transfer'
      operationId: get_v1-transfers
    post:
      summary: Create transfer
      description: Initiate a transfer for a created quote and provided details.
      tags:
      - Transfers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transfers_dto_v2.TransferRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models_v2.Transfer'
      operationId: post_v1-transfers
  /v1/usage:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: Get usage
      tags:
      - Usage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/transfers_models_v2.Usage'
      operationId: get_v1-usage
  /v1/vaults/credentials:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/bp_models.PasskeyCredential'
      operationId: get_v1-vaults-credentials
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bp_dto.CredentialCreationResponse'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bp_models.PasskeyCredential'
      operationId: post_v1-vaults-credentials
  /v1/virtual_accounts/{key}:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: Get a virtual account
      description: Retrieves details of a specific virtual account by key.
      tags:
      - Virtual Accounts
      parameters:
      - in: path
        name: key
        description: Unique key to identify the virtual account.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models_v2.VirtualAccount'
      operationId: get_v1-virtual-accounts-key
    post:
      summary: Update a virtual account
      tags:
      - Virtual Accounts
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transfers_dto_v2.VirtualAccountUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models_v2.VirtualAccount'
      operationId: post_v1-virtual-accounts-key
  /v1/virtual_accounts/list:
    get:
      parameters:
      - in: query
        name: destination
        schema:
          type: string
      - in: query
        name: schemaIn
        schema:
          type: string
      - in: query
        name: currencyIn
        schema:
          type: string
      - in: query
        name: railOut
        schema:
          type: string
      - in: query
        name: currencyOut
        schema:
          type: string
      - in: query
        name: isActive
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/transfers_models_v2.VirtualAccount'
      operationId: get_v1-virtual-accounts-list
  /v1/virtual_accounts:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      parameters:
      - in: query
        name: destination
        required: true
        schema:
          type: string
      - in: query
        name: schemaIn
        required: true
        schema:
          type: string
      - in: query
        name: currencyIn
        schema:
          type: string
      - in: query
        name: railOut
        required: true
        schema:
          type: string
      - in: query
        name: currencyOut
        required: true
        schema:
          type: string
      - in: query
        name: reference
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models_v2.VirtualAccount'
      operationId: get_v1-virtual-accounts
    post:
      summary: Create virtual account
      description: Creates a new virtual account with the provided details.
      tags:
      - Virtual Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transfers_dto_v2.VirtualAccountCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_models_v2.VirtualAccount'
      operationId: post_v1-virtual-accounts
  /v1/wallets:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: List wallets
      description: Lists all wallets linked to the account
      tags:
      - Account Wallets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/bp_models.Wallet'
      operationId: get_v1-wallets-1
    post:
      summary: Create wallet
      description: Creates wallet and links it to the account
      tags:
      - Account Wallets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bp_dto.AddWalletRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bp_models.Wallet'
      operationId: post_v1-wallets-1
  /v1/wallets/{walletId}/balance:
    parameters:
    - $ref: '#/components/parameters/DueAccountIdHeader'
    get:
      summary: Get wallet balances
      description: Retrieves balances for a specific wallet
      tags:
      - Wallets
      parameters:
      - in: path
        name: walletId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfers_dto_v2.WalletBalanceResponse'
      operationId: get_v1-wallets-walletid-balance
  /v1/webhook_endpoints/{webhookId}/events/:
    get:
      parameters:
      - in: path
        name: webhookId
        required: true
        schema:
          type: string
      - in: query
        name: onlyFailed
        schema:
          type: boolean
      - in: query
        name: next
        schema:
          type: string
      - in: query
        name: order
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
      - in: query
        name: startDate
        schema:
          type: string
          format: date-time
      - in: query
        name: endDate
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repository.CursorPage--bp_models.WebhookEvent'
      operationId: get_v1-webhook-endpoints-webhookid-events
  /v1/webhook_endpoints:
    get:
      tags:
      - Webhooks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/bp_models.WebhookEndpoint'
      operationId: get_v1-webhook-endpoints
    post:
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
